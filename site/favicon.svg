<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Losango do PolystnX: as quatro cores dos botões do controle de PS1 -->
  <g transform="translate(64 64) rotate(45)">
    <rect x="-38" y="-38" width="34" height="34" fill="#2f6bbf"/>
    <rect x="4"   y="-38" width="34" height="34" fill="#b3382e"/>
    <rect x="-38" y="4"   width="34" height="34" fill="#2e7d46"/>
    <rect x="4"   y="4"   width="34" height="34" fill="#d98cab"/>
  </g>
  <!-- O "P" da marca: caixa alta itálico, como no wordmark PolystnX -->
  <text x="64" y="78" font-family="Archivo Black, Arial Black, sans-serif"
        font-size="44" font-style="italic" font-weight="900" fill="#f2ede3"
        text-anchor="middle">P</text>
</svg>
