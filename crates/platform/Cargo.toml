[package]
name = "xperience-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "SDL3 shell: window, CRT-tube video output, audio queue, gamepad and keyboard input."

[features]
# Build and statically link SDL3 from vendored source (needs CMake + a C
# compiler). Used by CI so the three runners don't depend on a system SDL3.
# Locally, leave this off and use the SDL3 from your package manager.
vendored-sdl = ["sdl3/build-from-source-static"]

[dependencies]
sdl3 = { version = "0.20", features = ["unsafe_textures"] }
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = [
    "regular",
    "size_20",
    "unicode-basic-latin",
    "unicode-latin-1-supplement",
] }
log.workspace = true
thiserror.workspace = true
