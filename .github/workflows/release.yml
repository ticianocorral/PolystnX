name: Release

# Builds distributable packages — DMG (macOS), a zip of self-contained exes
# (Windows), AppImage (Linux) — and attaches them to the GitHub Release for
# the pushed tag. All three build with the vendored-sdl feature, so none of
# them need SDL3 installed on the machine that runs them.
#
# The core (swanstation_libretro) and ROMs are never bundled — see
# THIRD-PARTY-NOTICES.md. `xperience` looks for `--core`, then
# $PSX_XPERIENCE_CORE, then <data dir>/core/swanstation_libretro.{dylib,so,dll}.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build artifacts for, e.g. v0.3.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        run: echo "v=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build (vendored SDL3)
        run: cargo build --release --bin polystnx --features polystnx-platform/vendored-sdl
      - name: Package DMG
        run: |
          ./packaging/macos/build-dmg.sh target/release/polystnx "${{ steps.ver.outputs.v }}" \
            "PolystnX-${{ steps.ver.outputs.v }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: PolystnX-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (vendored SDL3)
        run: cargo build --release --workspace --features polystnx-platform/vendored-sdl
      - name: Package zip
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          DIR="dist/PolystnX"
          mkdir -p "$DIR"
          cp target/release/polystnx.exe target/release/emu-run.exe \
             target/release/selector.exe "$DIR/"
          cp README.md CHANGELOG.md THIRD-PARTY-NOTICES.md "$DIR/"
          (cd dist && 7z a "../PolystnX-$VERSION-windows-x86_64.zip" "PolystnX")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: PolystnX-*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same list as ci.yml — SDL3's own CMake build wants these.
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev libibus-1.0-dev
      - name: Version
        id: ver
        run: echo "v=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build (vendored SDL3)
        run: cargo build --release --bin polystnx --features polystnx-platform/vendored-sdl
      - name: Package AppImage
        run: |
          ./packaging/linux/build-appimage.sh target/release/polystnx "${{ steps.ver.outputs.v }}" \
            "PolystnX-${{ steps.ver.outputs.v }}-linux-x86_64.AppImage"
      - name: Package Flatpak
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes \
            org.kde.Platform//6.8 org.kde.Sdk//6.8
          mkdir -p packaging/flatpak
          cp target/release/polystnx packaging/flatpak/polystnx-bin
          flatpak-builder --force-clean --repo=flatpak-repo flatpak-build \
            packaging/flatpak/dev.ticianocorral.PolystnX.yml
          flatpak build-bundle flatpak-repo \
            "PolystnX-${{ steps.ver.outputs.v }}-linux-x86_64.flatpak" \
            dev.ticianocorral.PolystnX
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: PolystnX-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: PolystnX-*.flatpak

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          gh release upload "$TAG" macos-dmg/*.dmg windows-zip/*.zip linux-appimage/*.AppImage linux-flatpak/*.flatpak \
            --repo "${{ github.repository }}" --clobber
