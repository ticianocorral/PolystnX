# Manifest do PolystnX para o Flathub — o par de arquivos a colar na raiz do
# fork do flathub/flathub (branch criada a partir de `new-pr`) é este aqui e
# o cargo-sources.json gerado por gerar-cargo-sources.py.
#
# Diferenças para o flatpak antigo de publicação própria
# (packaging/flatpak/dev.ticianocorral.PolystnX.yml): aquele empacotava o
# BINÁRIO pré-compilado pela CI — o Flathub exige build from source e sem
# rede durante a compilação. Aqui o app compila do git (tag) com as
# dependências do cargo-sources.json (crates.io com sha256, incluindo o SDL
# embutido nos crates sdl3-src/sdl3-image-src/sdl3-mixer-src que o feature
# vendored-sdl compila) e rustc/cargo da extensão rust-stable do runtime
# (sem rustup/curl).
#
# IMPORTANTE: o Flathub só aceita release ESTÁVEL. A tag pinada abaixo é a
# beta atual (v1.2.2-beta) só para testar o build localmente — antes de
# abrir o PR, atualize tag/commit para a primeira tag estável (e rode o
# gerar-cargo-sources.py de novo se o Cargo.lock tiver mudado).
id: io.github.ticianocorral.PolystnX
runtime: org.freedesktop.Platform
runtime-version: "25.08"  # VERIFICAR antes do PR: tem que ser a série mais nova do Flathub (flatpak remote-info flathub org.freedesktop.Platform)
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: polystnx
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  # Download do core SwanStation (libretro) no primeiro uso, acionado por
  # quem usa — justificar na descrição do PR.
  - --share=network
  - --device=all
  # Ler discos (.chd) e BIOS em qualquer pasta de casa — justificar na
  # descrição do PR.
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - "*.a"
  - "*.la"
modules:
  - name: polystnx
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # O repo tem rust-toolchain.toml (pedindo rustfmt/clippy); o cargo
        # do SDK não é shim de rustup e ignora o arquivo — a variável é
        # cinto de segurança caso a extensão embarque shims.
        RUSTUP_TOOLCHAIN: stable
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - cargo build --release --offline --bin polystnx --features polystnx-platform/vendored-sdl
      - install -Dm755 target/release/polystnx -t /app/bin/
      - install -Dm644 packaging/flatpak/io.github.ticianocorral.PolystnX.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.ticianocorral.PolystnX.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/polystnx-256.png /app/share/icons/hicolor/256x256/apps/io.github.ticianocorral.PolystnX.png
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.ticianocorral.PolystnX/
      - install -Dm644 THIRD-PARTY-NOTICES.md -t /app/share/licenses/io.github.ticianocorral.PolystnX/
    sources:
      - type: git
        url: https://github.com/ticianocorral/PolystnX.git
        tag: v1.2.2-beta  # trocar pela primeira tag ESTÁVEL antes do PR
        commit: 89c2175636fa9d1a435c76753539145a94d495b8
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
