[workspace]
resolver = "2"
members = [
    "crates/emulation",
    "crates/platform",
    "crates/domain",
    "crates/ra",
    "crates/ntsc",
    "crates/app",
]

[workspace.package]
version = "1.0.0-beta"
edition = "2021"
license = "MIT"
repository = "https://github.com/ticianocorral/polystnx"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
crc32fast = "1.4"
md-5 = "0.10"
polystnx-ra = { path = "crates/ra" }
sha1 = "0.10"
hex = "0.4"

# Build the whole workspace with optimisation even in dev: the emulator loop
# is unusably slow otherwise. Debug symbols stay on.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
